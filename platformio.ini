board = m5stick-c
framework = arduino

monitor_speed = 115200
upload_speed = 1500000

lib_deps =
    m5stack/M5StickCPlus @ ^0.1.0
    olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0

build_flags =
    -DM5STICKCPLUS
